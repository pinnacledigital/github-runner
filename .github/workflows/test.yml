name: Unit Tests

on:
  push:
    branches: [master]
    paths:
      - 'test/**'
      - 'token-entrypoint.sh'
      - 'action.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run runner-check tests
        run: bash test/runner-check.sh
      - name: Run token-rotation tests
        run: bash test/token-rotation.sh
